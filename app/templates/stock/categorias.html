{% extends "base.html" %}
{% block title %}Categorías{% endblock %}
{% block content %}
<h1>Categorías</h1>
<div class="tabla-wrap" style="padding:20px; max-width:420px;">
<form method="POST" style="display:flex; gap:10px; align-items:flex-end;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div style="flex:1;">
        <label>Nueva categoría</label>
        <input type="text" name="nombre" placeholder="Ej: Tecnología" required style="margin-bottom:0;">
    </div>
    <button type="submit" class="btn-primario">Agregar</button>
</form>
</div>

<div class="tabla-wrap" style="max-width:420px;">
<table>
    {% for c in categorias %}
    <tr><td>{{ c.nombre }}</td></tr>
    {% else %}
    <tr><td style="text-align:center; color:var(--texto-muted);">Sin categorías todavía.</td></tr>
    {% endfor %}
</table>
</div>
<p style="margin-top:16px;"><a href="{{ url_for('stock.index') }}">← Volver a Stock</a></p>
{% endblock %}
